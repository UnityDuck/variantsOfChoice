<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Освоение {{ planet }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h1 class="display-4">Планета {{ planet }}</h1>
        <h2 class="mt-4">Почему стоит начать её освоение:</h2>
        <div class="mt-3">
            <div class="alert alert-primary" role="alert">
                Она близка к Земле!
            </div>
            <div class="alert alert-success" role="alert">
                На ней много ресурсов!
            </div>
            <div class="alert alert-warning" role="alert">
                У неё интересная история!
            </div>
            <div class="alert alert-info" role="alert">
                Она может быть новым домом для человечества!
            </div>
            <div class="alert alert-danger" role="alert">
                Идеальна для исследований и научных открытий!
            </div>
        </div>
    </div>
</body>
</html>
